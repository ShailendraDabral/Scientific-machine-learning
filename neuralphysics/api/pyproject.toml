[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralphysics-api"
version = "0.1.0"
description = "FastAPI service that runs NeuralPhysics training jobs and streams their results"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5", "neuralphysics"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.26"]

[tool.setuptools.packages.find]
include = ["app*"]
